<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1B365D">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>BlueForge Certificates</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: phone-first app shell — sticky top bar, scrolling form cards, fixed bottom tab bar; max 640px centred on bigger screens */
:root{
  --bg:#EDF1F6; --surface:#FFFFFF; --ink:#0F1B2D; --muted:#5A6B82; --line:#D3DBE6;
  --navy:#1B365D; --blue:#2E75B6; --blue-soft:#E1ECF8; --on-navy:#FFFFFF; --field:#F7F9FC;
  --pass:#17663F; --pass-bg:#DBF2E5; --check:#8A5300; --check-bg:#FFF0C4; --fail:#B42318; --fail-bg:#FDE2DF;
  --c1:#FFFFFF; --c1-bg:#B42318;
  --f-display:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1420; --surface:#141F30; --ink:#E5ECF5; --muted:#93A4BA; --line:#27364C;
  --navy:#0A1A30; --blue:#63A6EA; --blue-soft:#1A2E48; --on-navy:#FFFFFF; --field:#101A29;
  --pass:#7FDBA6; --pass-bg:#123524; --check:#F5C66A; --check-bg:#3A2C0C; --fail:#FF9B90; --fail-bg:#43171A;
  --c1:#FFFFFF; --c1-bg:#C0392B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1420; --surface:#141F30; --ink:#E5ECF5; --muted:#93A4BA; --line:#27364C;
  --navy:#0A1A30; --blue:#63A6EA; --blue-soft:#1A2E48; --on-navy:#FFFFFF; --field:#101A29;
  --pass:#7FDBA6; --pass-bg:#123524; --check:#F5C66A; --check-bg:#3A2C0C; --fail:#FF9B90; --fail-bg:#43171A;
  --c1:#FFFFFF; --c1-bg:#C0392B; color-scheme:dark}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
.shell{max-width:640px;margin:0 auto;min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--navy);color:var(--on-navy);padding:10px 16px;display:flex;align-items:center;gap:10px;min-height:56px}
.has-logo .top::after{content:"";flex:none;width:44px;height:44px;border-radius:9px;background:url(logo-mark.png) center/contain no-repeat;order:99;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}
.locklogo{display:block;height:70px;max-width:240px;margin:0 auto 10px;object-fit:contain;background:#fff;border-radius:12px;padding:6px}
#splash{position:fixed;inset:0;z-index:50;background:var(--navy);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;color:var(--on-navy);transition:opacity .4s}
#splash.gone{opacity:0;pointer-events:none}
#splash .sl{width:min(78vw,340px);max-height:40vh;object-fit:contain;background:#fff;border-radius:20px;padding:18px 20px}
#splash .st{font-family:var(--f-display);font-weight:700;letter-spacing:.14em;font-size:15px;opacity:.85}
.labprev{overflow-x:auto;background:#2a2a2a;border-radius:10px;padding:14px 10px;margin:4px 0 10px;-webkit-overflow-scrolling:touch}
.labcv{display:block;height:72px;width:auto;max-width:none;background:#fff;border-radius:3px;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.labrow{display:grid;grid-template-columns:44px 30px minmax(0,1fr);grid-template-areas:"t n i" ". . d";gap:2px 8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.labrow > .chip{grid-area:t;padding:0;min-width:44px;width:44px}
.labrow > .cno{grid-area:n;font-family:var(--f-mono);text-align:center;width:auto;height:auto;background:none;color:inherit;margin:0}
.labrow > input{grid-area:i}
.labrow input{min-width:0;width:100%;font:inherit;font-size:16px;padding:9px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--field);color:inherit}
.labrow > span.small{grid-area:d}
.labrow.off input,.labrow.off .cno{opacity:.45}
.exrow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:6px;padding:8px 0;border-top:1px solid var(--line)}
.exrow:first-of-type{border-top:0}
.exrow input,.exrow select{min-width:0;width:100%;font:inherit;font-size:16px;padding:9px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--field);color:inherit}
.exrow .btn{justify-self:start}
.rbrow{padding:10px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.rbrow:first-child{border-top:0}
.rbrow.off{opacity:.5}
.rbrow.low{background:var(--fail-bg);margin:0 -10px;padding:10px;border-radius:10px}
.rbrow select,.rbrow input{font:inherit;font-size:16px;padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--field);color:inherit;min-width:0}
.rbrow select{flex:1}
.rbpos{font-family:var(--f-mono);min-width:1.6em;text-align:center}
.readcard label.btn{cursor:pointer}
.ask .q{font-weight:600;margin-bottom:6px}
.ask .a p{margin:0 0 8px}.ask .a ul,.ask .a ol{margin:0 0 8px;padding-left:20px}.ask .a li{margin:2px 0}
.tile:disabled{opacity:.45}
.tstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;margin-bottom:10px}
.tstats b{display:block;font-family:var(--f-display);font-size:26px;color:var(--blue)}.tstats span{font-size:12px;color:var(--muted)}
.card-link.trtopic{text-align:left;justify-content:flex-start}.card-link.trtopic .grow{width:100%;display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;text-align:left}.card-link.trtopic .t{grid-column:1/-1;text-align:left}
.tbar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}.tbar i{display:block;height:100%}
.qprog{height:5px;border-radius:3px;background:var(--line);overflow:hidden;margin-bottom:10px}.qprog i{display:block;height:100%;background:var(--blue)}
.qtext{font-size:17px;font-weight:600;line-height:1.4;margin:6px 0 10px;white-space:pre-line}
.qopts{display:flex;flex-direction:column;gap:8px}
.qopt{display:flex;gap:10px;align-items:flex-start;text-align:left;font:inherit;font-size:15.5px;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:var(--field);color:inherit;cursor:pointer}
.qopt span{flex:none;width:24px;height:24px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-weight:700;font-size:13px}
.qopt.picked{border-color:var(--blue);background:var(--blue-soft)}.qopt.right{border-color:var(--pass);background:var(--pass-bg)}.qopt.wrong{border-color:var(--fail);background:var(--fail-bg)}.qopt.dim{opacity:.55}
.qexp{margin-top:12px;padding:12px;border-radius:12px;font-size:14.5px}.qexp.ok{background:var(--pass-bg)}.qexp.no{background:var(--fail-bg)}.qexp p{margin:4px 0}.qexp ol,.qexp ul{margin:4px 0;padding-left:20px}
.qgrid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-top:14px}.qgrid button{font:inherit;font-size:13px;padding:8px 0;border-radius:8px;border:1.5px solid var(--line);background:var(--field);color:inherit}
.qgrid .done{background:var(--blue-soft);border-color:var(--blue)}.qgrid .cur{outline:2px solid var(--blue)}
.qscore{text-align:center}.qscore b{display:block;font-family:var(--f-display);font-size:40px}.qscore.ok b{color:var(--pass)}.qscore.mid b{color:var(--check)}.qscore.no b{color:var(--fail)}
.qreview{border-top:1px solid var(--line);padding:10px 0}.qreview .qtext{font-size:14.5px;margin:0 0 4px}
.amitem{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line);font-size:15px;cursor:pointer}.amitem input{width:22px;height:22px;flex:none;margin-top:1px}
.rulefail{color:var(--fail);font-weight:700}
details.frow{border:1px solid var(--line);border-radius:12px;padding:0 12px;margin-bottom:8px;background:var(--field)}
details.frow>summary{padding:12px 0;cursor:pointer;display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:15px}
details.frow[open]>summary{border-bottom:1px solid var(--line);margin-bottom:8px}
.presets{display:flex;flex-direction:column;gap:8px;margin-top:10px}.presets .card-link:disabled{opacity:.6}
ol.steps{margin:6px 0 8px;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.top h1{font-family:var(--f-display);font-weight:700;font-size:20px;margin:0;letter-spacing:.02em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sub{display:block;font-family:var(--f-body);font-weight:400;font-size:12px;opacity:.75;letter-spacing:0;overflow:hidden;text-overflow:ellipsis}
.brandmark{font-family:var(--f-display);font-weight:700;letter-spacing:.12em;font-size:12px;opacity:.8}
.iconbtn{background:transparent;border:1px solid rgba(255,255,255,.35);color:var(--on-navy);border-radius:10px;min-width:40px;height:40px;padding:0 10px;font-size:15px;cursor:pointer}
.iconbtn:focus-visible,.btn:focus-visible,.chip:focus-visible,.tab:focus-visible,.card-link:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.status{font-size:12px;padding:6px 16px;color:var(--muted);display:flex;gap:8px;align-items:center}
.status .dot{width:8px;height:8px;border-radius:50%;background:var(--pass)}
.status.warn .dot{background:var(--check)}
.status.err .dot{background:var(--fail)}
main{padding-inline:16px;padding-block:8px 24px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h2{font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--blue);margin:0;display:flex;align-items:center;gap:8px;text-wrap:balance}
.card h2 .count{margin-left:auto;font-family:var(--f-body);letter-spacing:0;text-transform:none;color:var(--muted);font-weight:500;font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:380px){.grid2{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span{font-size:12.5px;font-weight:600;color:var(--muted);letter-spacing:.01em}
.field input,.field select,.field textarea{width:100%;min-height:46px;border:1.5px solid var(--line);background:var(--field);border-radius:10px;padding:10px 12px;font-size:16px}
.field textarea{min-height:80px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--blue);background:var(--surface)}
.field input.num{font-family:var(--f-mono);font-weight:500;font-variant-numeric:tabular-nums}
.field .hint{font-size:12px;color:var(--muted)}
.unit{position:relative}
.unit input{padding-right:44px}
.unit em{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-style:normal;color:var(--muted);font-size:13px;font-family:var(--f-mono);pointer-events:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:var(--field);border-radius:999px;min-height:40px;min-width:44px;padding:0 13px;font-weight:600;font-size:15px;cursor:pointer;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.chip.code-C1[aria-pressed="true"]{background:var(--c1-bg);border-color:var(--c1-bg);color:var(--c1)}
.chip.code-C2[aria-pressed="true"]{background:var(--fail-bg);border-color:var(--fail);color:var(--fail)}
.chip.code-C3[aria-pressed="true"]{background:var(--blue-soft);border-color:var(--blue);color:var(--blue)}
.chip.code-FI[aria-pressed="true"]{background:var(--check-bg);border-color:var(--check);color:var(--check)}
.chip.small{min-height:34px;min-width:38px;padding:0 9px;font-size:13.5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;border:1.5px solid var(--blue);background:var(--blue);color:#fff;font-weight:600;font-size:16px;cursor:pointer;text-decoration:none}
.btn.ghost{background:transparent;color:var(--blue)}
.btn.danger{background:transparent;border-color:var(--fail);color:var(--fail)}
.btn.block{width:100%}
.btn.sm{min-height:38px;font-size:14px;padding:0 12px;border-radius:10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.muted{color:var(--muted)}
.small{font-size:13px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:700;letter-spacing:.03em;white-space:nowrap}
.pill.pass{background:var(--pass-bg);color:var(--pass)}
.pill.check{background:var(--check-bg);color:var(--check)}
.pill.fail{background:var(--fail-bg);color:var(--fail)}
.pill.none{background:var(--blue-soft);color:var(--muted)}
.card-link{display:flex;gap:12px;align-items:center;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer}
.card-link .t{font-weight:600;font-size:16px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-link .d{font-size:13px;color:var(--muted)}
.card-link .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.cno{font-family:var(--f-mono);font-weight:700;font-size:15px;min-width:34px;height:34px;border-radius:9px;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center}
.figs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (max-width:380px){.figs{grid-template-columns:repeat(2,1fr)}}
.fig{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--field);min-width:0}
.fig b{display:block;font-family:var(--f-mono);font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.fig span{display:block;font-size:11.5px;color:var(--muted);font-weight:600;line-height:1.25}
.fig.key{border-color:var(--blue);background:var(--blue-soft)}
.checks{display:flex;flex-direction:column;gap:8px}
.chk{display:flex;gap:10px;align-items:flex-start;border-left:4px solid var(--line);padding:4px 0 4px 10px}
.chk.pass{border-color:var(--pass)} .chk.check{border-color:var(--check)} .chk.fail{border-color:var(--fail)}
.chk .l{font-weight:600;min-width:92px}
.chk .x{flex:1;min-width:0;font-size:14px;color:var(--muted)}
.banner{border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:4px}
.banner.pass{background:var(--pass-bg);color:var(--pass)}
.banner.fail{background:var(--fail-bg);color:var(--fail)}
.banner.none{background:var(--blue-soft);color:var(--ink)}
.banner strong{font-family:var(--f-display);font-size:26px;letter-spacing:.05em}
.codes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.codes div{border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center;background:var(--surface)}
.codes b{display:block;font-family:var(--f-mono);font-size:22px}
.codes span{font-size:12px;font-weight:700}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{background:none;border:0;padding:9px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--blue)}
.tab .badge{font-size:10px;border-radius:999px;padding:0 5px;background:var(--fail);color:#fff;margin-left:2px}
.insp-sec{display:flex;flex-direction:column;gap:0}
.insp-item{padding:10px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:7px}
.insp-item:first-child{border-top:0}
.insp-item .q{font-size:14.5px}
.insp-item .q b{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);margin-right:6px}
.obs{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--field)}
.sig{width:100%;height:150px;border:1.5px dashed var(--line);border-radius:10px;background:var(--field);touch-action:none;display:block}
.empty{text-align:center;padding:26px 12px;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.boards{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.warnline{font-size:13.5px;background:var(--check-bg);color:var(--check);border-radius:10px;padding:10px 12px}
.errline{font-size:13.5px;background:var(--fail-bg);color:var(--fail);border-radius:10px;padding:10px 12px}
.auto{font-family:var(--f-mono);font-weight:600;font-size:15px;min-height:46px;display:flex;align-items:center;gap:8px;padding:0 12px;border-radius:10px;background:var(--blue-soft);flex-wrap:wrap}
.auto .pill{font-family:var(--f-body)}
details.more>summary{cursor:pointer;font-weight:600;color:var(--blue);list-style:none;min-height:40px;display:flex;align-items:center}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::before{content:"+";font-family:var(--f-mono);margin-right:8px}
details.more[open]>summary::before{content:"–"}
details.more>div{display:flex;flex-direction:column;gap:12px}
.hero{background:var(--navy);color:var(--on-navy);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:6px}
.hero h2{font-family:var(--f-display);font-size:26px;margin:0;line-height:1.1;text-wrap:balance}
.hero p{margin:0;opacity:.8;font-size:14px}
.ex-tag{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--check);background:var(--check-bg);border-radius:6px;padding:2px 6px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{display:flex;flex-direction:column;gap:3px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 10px;cursor:pointer;min-width:0}
.tile b{font-family:var(--f-display);font-size:17px;color:var(--blue)}
.tile span{font-size:12.5px;color:var(--muted)}
.typetag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--blue-soft);color:var(--blue);border-radius:5px;padding:1px 6px;margin-right:4px}
.codes-list{display:flex;flex-direction:column;gap:8px}
.code-item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.book{font-size:15px;line-height:1.5}
.book p,.book ul,.book ol{margin:0}
.book ul,.book ol{padding-left:20px;display:flex;flex-direction:column;gap:6px}
.book table,.bt{border-collapse:collapse;width:100%;font-size:14px}
.book th,.book td,.bt th,.bt td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.book th,.bt th{background:var(--blue-soft);color:var(--ink);font-weight:600}
.bt td{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.tscroll{overflow-x:auto;max-width:100%}
.card-link+.card-link{margin-top:0}
.thumbs{display:flex;flex-wrap:wrap;gap:8px}
.thumb{width:84px;height:84px;border-radius:10px;border:1.5px solid var(--line);background:var(--field);padding:0;overflow:hidden;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:11px;color:var(--muted);text-align:center}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.add{flex-direction:column;border-style:dashed;color:var(--blue);font-size:26px;font-weight:600;line-height:1}
.thumb.add span{font-size:12px}
.thumb.add.alt{border-style:solid;gap:4px;font-size:12px}
.slot{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.slot:first-of-type{border-top:0;padding-top:0}
.viewer{position:fixed;inset:0;z-index:20;background:rgba(5,10,18,.94);display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px))}
.viewer .vbar{display:flex;gap:8px;align-items:center}
.viewer .vbar .btn{background:rgba(255,255,255,.08);color:#fff;border-color:rgba(255,255,255,.4)}
.viewer .vbar .btn.danger{color:#FF9B90;border-color:#FF9B90}
.viewer .vimg{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;margin-top:10px;color:#ccd}
.viewer .vimg img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px}
.toast{position:fixed;left:16px;right:16px;bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:21;max-width:600px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 14px;font-size:14px}
.lock{position:fixed;inset:0;z-index:50;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(20px + env(safe-area-inset-bottom,0px))}
.lockin{width:100%;max-width:320px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.lockin h2{font-family:var(--f-display);font-size:24px;margin:0}
.dots{font-size:26px;letter-spacing:10px;font-family:var(--f-mono)}
.keypad{display:grid;grid-template-columns:repeat(3,72px);gap:14px;justify-content:center}
.key{width:72px;height:72px;border-radius:50%;border:1.5px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);color:#fff;font-size:26px;font-family:var(--f-mono);cursor:pointer}
.key:active{background:rgba(255,255,255,.25)}
.linkbtn{background:none;border:0;color:rgba(255,255,255,.75);text-decoration:underline;font-size:14px;cursor:pointer;min-height:40px}
.micfab{position:fixed;right:16px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:7;width:64px;height:64px;border-radius:50%;border:0;background:var(--blue);color:#fff;box-shadow:0 6px 18px rgba(0,0,0,.25);display:grid;place-items:center;cursor:pointer}
.micfab svg{width:28px;height:28px}
.micfab.on{background:var(--fail)}
.shell.has-fab{padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
.voice{position:fixed;left:0;right:0;bottom:0;z-index:8;padding:0 12px calc(12px + env(safe-area-inset-bottom,0px))}
.voice .in{max-width:640px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 -4px 24px rgba(0,0,0,.18);padding:14px;display:flex;flex-direction:column;gap:10px}
.voice .heard{font-size:15px;min-height:22px}
.voice .heard i{color:var(--muted)}
.voice .got{display:flex;flex-wrap:wrap;gap:6px}
.voice .got span{background:var(--pass-bg);color:var(--pass);border-radius:8px;padding:4px 8px;font-size:13.5px;font-weight:600;font-family:var(--f-mono)}
.pulse{width:12px;height:12px;border-radius:50%;background:var(--fail);display:inline-block}
@media (prefers-reduced-motion:no-preference){.pulse{animation:pl 1s infinite ease-in-out}@keyframes pl{50%{opacity:.3;transform:scale(.7)}}}
.dict{align-self:flex-start}
@media (prefers-reduced-motion:no-preference){.card,.card-link{transition:border-color .15s}}
